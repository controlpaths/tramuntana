# Tramuntana Lite r1a - main firmware: a USB composite device with three
# CDC-ACM ports (shell / binary API / UART bridge) driving the board's
# instruments. See src/main.c for the map.

CONFIG_GPIO=y
CONFIG_REGULATOR=y
CONFIG_DISPLAY=y
CONFIG_SPI=y
CONFIG_ADC=y
CONFIG_PWM=y
CONFIG_DMA=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_HWINFO=y
CONFIG_CRC=y

# USB device (new stack), three CDC-ACM instances registered by src/usb.c.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
# CDC-ACM class work (rx/tx fifo handling, irq callbacks) on its own
# thread rather than the system workqueue, so USB never competes with
# the display/LED work items and vice versa.
CONFIG_USBD_CDC_ACM_WORKQUEUE=y
CONFIG_USBD_CDC_ACM_STACK_SIZE=2048
# The shell (and its log backend) runs over CDC-ACM, so the class can't
# log itself without recursing: Zephyr would force this anyway.
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y

# Shell on the first CDC-ACM port (chosen zephyr,shell-uart in the overlay).
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="tramuntana:~$ "
CONFIG_SHELL_CMD_BUFF_SIZE=512
CONFIG_SHELL_ARGC_MAX=40
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=2048

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_FPU=y

# The instruments drive the ADC, PWM, DMA and PIO blocks straight
# through the Pico SDK (hardware/*.h); the Zephyr drivers above are what
# pull those SDK sources in (PICOSDK_USE_* are selected by them) and
# bring the blocks out of reset at boot.
